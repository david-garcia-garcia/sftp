name: Build and Test

on:
  push:
    branches:
      - '**'  # Trigger on any branch
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'  # Trigger on PRs to any branch

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [debian, alpine]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load base image versions from .env.example
        run: |
          set -a
          source .env.example
          set +a
          echo "DEBIAN_VERSION=${DEBIAN_VERSION}" >> $GITHUB_ENV
          echo "ALPINE_VERSION=${ALPINE_VERSION}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.variant }} image
        run: |
          if [ "${{ matrix.variant }}" = "alpine" ]; then
            docker build \
              --build-arg ALPINE_VERSION=${{ env.ALPINE_VERSION }} \
              -f Dockerfile-alpine \
              -t david-garcia-garcia/sftp:alpine \
              .
          else
            docker build \
              --build-arg DEBIAN_VERSION=${{ env.DEBIAN_VERSION }} \
              -f Dockerfile \
              -t david-garcia-garcia/sftp:latest \
              .
          fi

      - name: Save Docker image
        run: |
          mkdir -p /tmp/docker-images
          if [ "${{ matrix.variant }}" = "alpine" ]; then
            docker save david-garcia-garcia/sftp:alpine -o /tmp/docker-images/sftp-alpine.tar
          else
            docker save david-garcia-garcia/sftp:latest -o /tmp/docker-images/sftp-debian.tar
          fi

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.variant }}
          path: /tmp/docker-images/*.tar
          retention-days: 1

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        variant: [debian, alpine]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.variant }}
          path: /tmp/docker-images

      - name: Load Docker images
        run: |
          docker load -i /tmp/docker-images/*.tar

      - name: Install PowerShell and Pester
        run: |
          # Set non-interactive mode to avoid prompts
          export DEBIAN_FRONTEND=noninteractive
          
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          
          # Download and install Microsoft signing key and repository
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          
          # Use dpkg with force-confdef and force-confold to handle config conflicts automatically
          sudo dpkg --force-confdef --force-confold -i packages-microsoft-prod.deb
          
          sudo apt-get update
          sudo apt-get install -y powershell
          
          # Install Pester testing framework
          pwsh -c "Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -RequiredVersion 5.5.0"

      - name: Start Docker services
        run: docker compose up -d

      - name: Run Pester integration tests
        shell: pwsh
        run: |
          ./Test-Integration.ps1 -ImageVariant ${{ matrix.variant }}

      - name: Show logs on failure
        if: failure()
        shell: pwsh
        run: |
          $containerName = if ("${{ matrix.variant }}" -eq "debian") { "sftp-server" } else { "sftp-server-alpine" }
          Write-Host "=== ${{ matrix.variant }} SFTP server logs ==="
          docker compose logs $containerName
          Write-Host ""
          Write-Host "=== SFTP client logs ==="
          docker compose logs sftp-client

      - name: Cleanup
        if: always()
        run: docker compose down -v

  push_to_registry:
    needs: test
    permissions:
      id-token: write
      attestations: write
      contents: read
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        variant: [debian, alpine]
    env:
      REGISTRY: docker.io
      IMAGE_NAME: david-garcia-garcia/sftp
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Load base image versions from .env.example
        run: |
          set -a
          source .env.example
          set +a
          echo "DEBIAN_VERSION=${DEBIAN_VERSION}" >> $GITHUB_ENV
          echo "ALPINE_VERSION=${ALPINE_VERSION}" >> $GITHUB_ENV
      
      - name: Set variant-specific variables
        run: |
          if [ "${{ matrix.variant }}" = "debian" ]; then
            echo "DOCKERFILE=Dockerfile" >> $GITHUB_ENV
            echo "BASE_VERSION=${{ env.DEBIAN_VERSION }}" >> $GITHUB_ENV
            echo "VARIANT_TAG=debian" >> $GITHUB_ENV
          else
            echo "DOCKERFILE=Dockerfile-alpine" >> $GITHUB_ENV
            echo "BASE_VERSION=${{ env.ALPINE_VERSION }}" >> $GITHUB_ENV
            echo "VARIANT_TAG=alpine" >> $GITHUB_ENV
          fi
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-${{ env.VARIANT_TAG }}-${{ env.BASE_VERSION }}
            type=semver,pattern={{major}}.{{minor}}-${{ env.VARIANT_TAG }}
            type=raw,value=${{ env.VARIANT_TAG }}
            type=raw,value=latest,enable=${{ matrix.variant == 'debian' }}
      
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEBIAN_VERSION=${{ env.DEBIAN_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
      
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: push_to_registry
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify tag is on master branch
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          git fetch origin master
          if ! git branch -r --contains $(git rev-parse $TAG_NAME) | grep -q "origin/master"; then
            echo "Error: Tag $TAG_NAME is not on master branch. Releases can only be created from master."
            exit 1
          fi
      
      - name: Load versions and generate release notes
        id: release_notes
        run: |
          source .env.example
          
          # Extract version from GitHub ref (e.g., refs/tags/v1.0.0 -> v1.0.0)
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Generate release notes header
          cat << EOF > release_notes.md
          ## 🐳 SFTP Server Docker Images
          
          ### 📦 Available Images
          
          **Debian-based:**
          \`\`\`bash
          docker pull david-garcia-garcia/sftp:${VERSION}-debian-${DEBIAN_VERSION}
          docker pull david-garcia-garcia/sftp:debian
          docker pull david-garcia-garcia/sftp:latest
          \`\`\`
          
          **Alpine-based:**
          \`\`\`bash
          docker pull david-garcia-garcia/sftp:${VERSION}-alpine-${ALPINE_VERSION}
          docker pull david-garcia-garcia/sftp:alpine
          \`\`\`
          
          ### 🔧 Base Images
          - **Debian:** \`debian:${DEBIAN_VERSION}\`
          - **Alpine:** \`alpine:${ALPINE_VERSION}\`
          
          ### 📚 Documentation
          See the [README](https://github.com/david-garcia-garcia/sftp/blob/master/README.md) for full configuration and usage documentation.
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "debian_version=${DEBIAN_VERSION}" >> $GITHUB_OUTPUT
          echo "alpine_version=${ALPINE_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
          failOnError: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SFTP Server ${{ steps.release_notes.outputs.version }} (Debian ${{ steps.release_notes.outputs.debian_version }} / Alpine ${{ steps.release_notes.outputs.alpine_version }})"
          body: |
            ${{ steps.release_notes.outputs.notes }}
            
            ---
            
            ## 📝 Changelog
            
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false
